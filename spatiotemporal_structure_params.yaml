postproc_data_parameters:
  
  drive_alignment_theta:
    beignet: 0
    affi: 90
  rc_axis_theta:
    beignet: 0
    affi: 0
  tbefore: 0.5
  tafter: 1
  bin_width: 0.01  # [s]
  exp_samplerate: 1000 # [Hz]
  smooth_width: 50
  smooth_nstd: 3
  align_events:
  - 'TARGET ONSET'
  - 'MOVEMENT ONSET'
  align_event_keys:
  - 'delay_start_time'
  - 'reach_end_time'
  raster_types:
  - 'neural'
  - 'cursor_pos'
  - 'cursor_velo'

unit_quality_metric_parameters:
  seconds_per_batch: 2
  epoch_size: 10 #[s]
  min_trial_prop: 1
  min_refractory_period: 1
  isi_perc_thresh: 1 #[%]
  isi_time_period: 1 #[ms]
  wf_amp_thresh: 50
  low_bin_thresh: 0.1
  uhq_std_thresh: 5

analysis_parameters:
  align_events:
  - 'MOVEMENT ONSET'
  cursor_corr_tbefore: 0.1
  cursor_corr_tafter: 0.4
  tstart: -0.05 # Start time for averaging around the event of interest
  tend: 0.25 # End time for averaging around the event of interest
  nfolds: 4
  niterations: 1000
  nunits_column: 25
  nunits_lda_depth: 5
  nunits_across_events: 30
  nunits_cca: 50
  npcs: 10
  nmodes_avg_cca: 4 # Number of modes to average correlation of from CCA
  depth_range: 1000 #[um] How many um are in each range
  depth_step: 250 #[um] How much the depth ranges advance by
  depth_max: 3840 # Length of channel bank recorded from
  min_site_depths: 5 # Minimum number of depths with enough units to perform decodign . 
  unit_adding_max_units: 300 
  unit_adding_unit_step: 5
  nneighbors: 1 # Number of neighboring sites to use to compute the average neighboring CCA correlation
  functional_group_names:
  - 'bd' # Bad decoding
  - 'p' # Good decoding only during preparation
  - 'm' # Good decoding only during movement
  - 'p+m' # Good decoding during both preparation and movement.


visualization_parameters:
  nmodes_plot: 3 # Number of modes to plot when looping through.
  colors:
    beignet: 'purple'
    affi: 'salmon'
    example_sites:
      1: [0.5, 0.25, 0.75]
      2: [0.5, 0.25, 0.25]
    random_units: 'Gray'
  poster_settings: # Default settings applied to matplotlib plots
    xtick.labelsize: 24
    ytick.labelsize: 24
    axes.labelsize: 28
    axes.titlesize: 28
    lines.linewidth: 6
    axes.spines.top: false
    axes.spines.right: false
  paper_settings:
    xtick.labelsize: 8
    ytick.labelsize: 8
    axes.labelsize: 10
    axes.titlesize: 10
    lines.linewidth: 2
    axes.spines.top: false
    axes.spines.right: false
  figure_sizes:
    poster:
      - small: [8,4]
      - large: [12, 8]
    paper:
      - small: [4,3]
      - large: [6.8, 5]
